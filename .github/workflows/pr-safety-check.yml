name: Goal Manager PR Safety Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full verification
        run: bash scripts/verify.sh
      - name: Check PWA assets
        run: |
          test -s suite-icon-release.json
          test -s assets/suite-icons/20261005a/icon-192.png
          test -s assets/suite-icons/20261005a/icon-512.png
          test -s assets/suite-icons/20261005a/icon-maskable-512.png
