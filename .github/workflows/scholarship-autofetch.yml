name: Scholarship AutoFetch
on:
  schedule:
    - cron: "27 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholarship-autofetch
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh scholarships
        run: |
          python tools/autofetch/scholarship_autofetch.py --repo .
          python -m json.tool data/scholarships.json >/dev/null
      - name: Commit scholarship data only
        run: |
          git config user.name "goal-manager-scholarship-autofetch"
          git config user.email "actions@users.noreply.github.com"
          git add data/scholarships.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(scholarship-radar): daily autofetch"
          git push
