name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Static QA
        run: |
          bash scripts/verify.sh

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest manifest-original.webmanifest sw.js suite-icon-release.json icon.svg icon-64.png icon-192.png icon-512.png icon-maskable-512.png icon-original-192.png icon-original-512.png apple-touch-icon.png apple-touch-original.png README.md _site/
          cp -r css js config data assets _site/
          cp -r apps _site/
          # Verify assets referenced by index.html, the PWA manifest and the service worker.
          test -s _site/suite-icon-release.json
          test -s _site/assets/suite-icons/20261005a/icon-64.png
          test -s _site/assets/suite-icons/20261005a/icon-192.png
          test -s _site/assets/suite-icons/20261005a/icon-512.png
          test -s _site/assets/suite-icons/20261005a/icon-maskable-512.png
          test -s _site/assets/suite-icons/20261005a/apple-touch-icon.png
          test -s _site/icon-192.png
          test -s _site/icon-512.png
          test -s _site/icon-maskable-512.png
          test -s _site/apple-touch-icon.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
