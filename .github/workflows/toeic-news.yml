name: TOEIC GitHub News Refresh
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: goal-manager-main-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh RSS metadata
        run: |
          set -euo pipefail
          python tools/toeic_news_refresh.py
          python -m json.tool apps/toeic/data/news.json >/dev/null
          git diff --check
      - name: Persist news data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- apps/toeic/data/news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "toeic-news-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/toeic/data/news.json
          git commit -m "chore(toeic): refresh news topics ${GITHUB_RUN_ID}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
