<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub 遷移最終核對</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7f6;color:#18342b;margin:0;padding:20px}
main{max-width:760px;margin:auto}.card{background:white;border:1px solid #dbe5e1;border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:24px}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #edf1ef}
.row:last-child{border-bottom:0}.pass{color:#08764f;font-weight:800}.fail{color:#b42318;font-weight:800}
small{color:#66756f}.summary{font-size:20px;font-weight:800}.code{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:#075c42;color:white}
</style>
</head>
<body><main>
<h1>GitHub 三系統遷移最終核對</h1>
<div id="summary" class="card summary">檢查中…</div>
<div id="out"></div>
<div class="card"><button onclick="location.reload()">重新檢查</button><p><small>此頁只讀取目前 127.0.0.1:8080 網域的本機資料，不會修改任何紀錄。</small></p></div>
</main>
<script>
const $=id=>document.getElementById(id);
const load=(k,f=null)=>{try{const raw=localStorage.getItem(k);return raw===null?f:JSON.parse(raw)}catch(_){return f}};
const checks=[];
function check(group,label,ok,detail=""){checks.push({group,label,ok:Boolean(ok),detail})}
function card(title,rows){return `<section class="card"><h2>${title}</h2>${rows.map(x=>`<div class="row"><div><b>${x.label}</b>${x.detail?`<br><small>${x.detail}</small>`:""}</div><span class="${x.ok?'pass':'fail'}">${x.ok?'PASS':'FAIL'}</span></div>`).join("")}</section>`}

try{
 const env=load('lawLangGoalSystemV92',null),d=env?.data||env||{},tasks=Array.isArray(d.tasks)?d.tasks:[],logs=Array.isArray(d.logs)?d.logs:[];
 const tids=new Set(tasks.map(x=>String(x.id))),uids=new Set(logs.map(x=>String(x.id)));
 const minutes=logs.reduce((n,x)=>n+(Number(x.minutes)||0),0);
 const toeicEvents=new Set(logs.filter(x=>x.sourceEventId).map(x=>String(x.sourceEventId)));
 check('Goal Manager','目標 61 個',tasks.length===61,`目前 ${tasks.length}`);
 check('Goal Manager','歷程 25 筆',logs.length===25,`目前 ${logs.length}`);
 check('Goal Manager','實際投入 378 分鐘',minutes===378,`目前 ${minutes} 分鐘`);
 check('Goal Manager','Task ID 無重複',tids.size===tasks.length,`${tids.size}/${tasks.length}`);
 check('Goal Manager','Log ID 無重複',uids.size===logs.length,`${uids.size}/${logs.length}`);
 check('Goal Manager','Log 全部能對應 Task',logs.every(x=>tids.has(String(x.taskId))),logs.filter(x=>!tids.has(String(x.taskId))).length+' 筆異常');
 check('Goal Manager','TOEIC 舊事件 7 組已入帳',toeicEvents.size===7,`目前 ${toeicEvents.size} 組`);
}catch(e){check('Goal Manager','核心資料可讀',false,String(e))}

try{
 const generated=load('generated',[]),sessions=load('sessions',[]),mistakes=load('mistakes',[]);
 const analysis=load('toeicArticleAnalysisCacheV1',[]),snap=load('toeicArticleReviewSnapshotsV1',[]),reviews=load('toeicReviewEvents',[]);
 const uniqueSessions=new Set((Array.isArray(sessions)?sessions:[]).map(x=>String(x.id)));
 check('TOEIC','教材 7 篇',Array.isArray(generated)&&generated.length===7,`目前 ${generated?.length??0}`);
 check('TOEIC','原始 Session 8 筆完整保留',Array.isArray(sessions)&&sessions.length===8,`目前 ${sessions?.length??0}`);
 check('TOEIC','Session 唯一 ID 7 組',uniqueSessions.size===7,`目前 ${uniqueSessions.size}`);
 check('TOEIC','錯題 12 題',Array.isArray(mistakes)&&mistakes.length===12,`目前 ${mistakes?.length??0}`);
 check('TOEIC','文章解析快取 6 篇',Array.isArray(analysis)&&analysis.length===6,`目前 ${analysis?.length??0}`);
 check('TOEIC','文章複習快照 7 篇',Array.isArray(snap)&&snap.length===7,`目前 ${snap?.length??0}`);
 check('TOEIC','複習事件 16 筆',Array.isArray(reviews)&&reviews.length===16,`目前 ${reviews?.length??0}`);
}catch(e){check('TOEIC','核心資料可讀',false,String(e))}

try{
 const id=localStorage.getItem('lazyLedgerId')||"",st=load('lazyLedgerCache:'+id,null)||{},tx=Array.isArray(st.transactions)?st.transactions:[];
 const food290=tx.filter(x=>x.category==='食'&&Number(x.amount)===290);
 check('Ledger','交易 24 筆',tx.length===24,`目前 ${tx.length}`);
 check('Ledger','生活費剩 5,899',Number(st.config?.allowanceRemaining)===5899,`目前 ${Number(st.config?.allowanceRemaining)||0}`);
 check('Ledger','食 290 已匯入且只出現一次',food290.length===1,`目前 ${food290.length} 筆`);
 check('Ledger','食 290 資金拆分正確',food290.length===1&&Number(food290[0].allowanceAmount)===290&&Number(food290[0].selfPaidAmount)===0,food290.length?`生活費 ${food290[0].allowanceAmount}／自費 ${food290[0].selfPaidAmount}`:'未找到');
 check('Ledger','所有交易拆分一致',tx.every(x=>Number(x.allowanceAmount)+Number(x.selfPaidAmount)===Number(x.amount)),'生活費 + 自費 = 金額');
}catch(e){check('Ledger','核心資料可讀',false,String(e))}

const groups=['Goal Manager','TOEIC','Ledger'];
$('out').innerHTML=groups.map(g=>card(g,checks.filter(x=>x.group===g))).join('');
const pass=checks.filter(x=>x.ok).length,total=checks.length;
$('summary').innerHTML=`${pass===total?'✅':'⚠️'} ${pass}/${total} 項通過${pass===total?'<br><small>資料層核對完成，可以進行正式 main 切換。</small>':'<br><small>先不要合併 main；把 FAIL 畫面傳回來。</small>'}`;
$('summary').classList.add(pass===total?'pass':'fail');
</script>
</body>
</html>
