<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00563B">
<title>目標管理修復</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f6f5;color:#173d33;margin:0;padding:32px}
.card{max-width:520px;margin:10vh auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 40px #0001}
h1{font-size:24px;margin:0 0 12px}
p{line-height:1.7;color:#5b6d67}
.ok{color:#08764f;font-weight:800}
.err{color:#b3261e;font-weight:800}
</style>
</head>
<body>
<div class="card">
<h1>目標管理修復中</h1>
<p id="status">正在解除舊版更新控制。你的目標、紀錄、計時與 localStorage 不會被刪除。</p>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        if(String(reg.scope||'').includes('/my-goal-manager/')){
          await reg.unregister();
        }
      }
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>
        k.startsWith('thu-goal-personal-v')||
        k.startsWith('law-goal-web-v')
      ).map(k=>caches.delete(k)));
    }
    try{
      Object.keys(sessionStorage).forEach(k=>{
        if(k.startsWith('thuPwaReload:')) sessionStorage.removeItem(k);
      });
    }catch(_){}
    status.className='ok';
    status.textContent='修復完成，正在重新開啟目標管理…';
    setTimeout(()=>location.replace('./?recovered=1&ts='+Date.now()),700);
  }catch(e){
    status.className='err';
    status.textContent='自動修復未完成：'+String(e&&e.message||e);
  }
})();
</script>
</body>
</html>
